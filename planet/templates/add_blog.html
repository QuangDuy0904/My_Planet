{% extends 'master.html' %} {% block title %}Add Blog{% endblock %} 
{% block content %}
<div id="main-wrapper">
  <div class="wrapper style3">
    <div class="inner">
      <div
        class="container"
        style="max-width: 650px; margin: 0 auto; padding: 20px 0"
      >
        <h2 style="margin-bottom: 20px; text-align: center">
          Thêm bài viết mới
        </h2>
        <form
          action="{% url 'add_blog' %}"
          enctype="multipart/form-data"
          method="POST"
        >
          {% csrf_token %} {{ form.media }} {{ form.as_p }}
          <div style="margin-top: 20px">
            <button
              type="submit"
              class="btn btn-primary"
              style="padding: 8px 25px"
            >
              Add Blog
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
