{% extends "master.html" %} {% block title %}Đăng Ký Tài Khoản{% endblock %}
{%block content %}
<form method="POST">
  {% csrf_token %}
  <h1>ĐĂNG KÝ TÀI KHOẢN</h1>

  <!-- Hiển thị lỗi nếu có (ví dụ: trùng tài khoản, mật khẩu không khớp) -->
  {% if form.errors %}
  <div
    style="
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
    "
  >
    {{ form.errors }}
  </div>
  {% endif %}

  <label for="id_username">Username:</label>
  <input
    type="text"
    name="username"
    id="id_username"
    required
    placeholder="Nhập tên đăng nhập"
  />

  <label for="id_email">Email:</label>
  <input
    type="email"
    name="email"
    id="id_email"
    required
    placeholder="Nhập địa chỉ email"
  />

  <label for="id_password1">Password:</label>
  <input
    type="password"
    name="password1"
    id="id_password1"
    required
    placeholder="Nhập mật khẩu"
  />

  <label for="id_password2">Confirm Password:</label>
  <input
    type="password"
    name="password2"
    id="id_password2"
    required
    placeholder="Nhập lại mật khẩu"
  />

  <button type="submit">ĐĂNG KÝ</button>

  <p>Đã có tài khoản? <a href="/login/">Đăng nhập</a></p>
</form>
{% endblock %}
