{% extends 'master.html' %}
{% block title %}Xác Nhận Xóa Bài Viết{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;">
  <h3 style="color: #dc3545; margin-bottom: 15px;">Xác nhận xóa bài viết?</h3>
  <p>Bạn có chắc chắn muốn xóa bài viết <strong>"{{ post.title }}"</strong>?</p>
  <form method="POST" style="margin-top: 25px;">
    {% csrf_token %}
    <button type="submit" style="padding: 10px 22px; background: #dc3545; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Xóa</button>
    <a href="{% url 'post_list' %}" style="margin-left: 15px; color: #555; text-decoration: none;">Hủy bỏ</a>
  </form>
</div>
{% endblock %}
