{% extends "master.html" %} {% block title %}Danh Sách Bài Viết{% endblock %}
{%block content %}
<div style="max-width: 700px; margin: 40px auto; padding: 0 20px">
  <h1 style="text-align: center; margin-bottom: 30px">Danh Sách Bài Viết</h1>

  <ul style="list-style: none; padding: 0">
    {% for post in posts %}
    <li style="border-bottom: 1px solid #e0e0e0; padding: 15px 0">
      <a
        href="{% url 'post_detail' post.id %}"
        style="
          font-size: 20px;
          font-weight: 600;
          text-decoration: none;
          color: #1a73e8;
        "
      >
        {{ post.title }}
      </a>
      <span
        style="display: block; color: #777; font-size: 13px; margin-top: 5px"
      >
        Ngày đăng: {{ post.date|date:"d/m/Y H:i" }}
      </span>
    </li>
    {% empty %}
    <li style="text-align: center; color: #888">Chưa có bài viết nào.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
