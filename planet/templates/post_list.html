{% extends "master.html" %} {% block title %}Danh Sách Bài Viết{% endblock %}
{%block content %}
<div
  style="
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    clear: both;
  "
>
  <h1 style="text-align: center; margin-bottom: 25px; color: #333">
    Danh Sách Bài Viết
  </h1>

  <div style="display: flex; flex-direction: column; gap: 15px">
    {% for post in posts %}
    <div
      style="
        padding: 16px 20px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        background: #fafafa;
      "
    >
      <a
        href="{% url 'post_detail' post.id %}"
        style="
          display: inline-block;
          font-size: 20px;
          font-weight: bold;
          color: #1a73e8;
          text-decoration: none;
          margin-bottom: 6px;
        "
      >
        {{ post.title }}
      </a>
      <div style="color: #64748b; font-size: 13px">
        Ngày đăng: {{ post.date|date:"d/m/Y H:i" }}
      </div>
    </div>
    {% empty %}
    <p style="text-align: center; color: #888">Chưa có bài viết nào.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
