{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Nạp file CSS tĩnh từ thư mục static -->
    <link rel="stylesheet" href="{% static 'myfirst.css' %}" />

    <!-- Icon FontAwesome cho biểu tượng ngôi nhà -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="wrapper style1">
      <div class="inner">
        <section class="container box feature1">
          <div class="row">
            <a href="{% url 'main' %}"><i style="font-size: 30px" class="fas fa-home"></i></a>
          </div>
          <h1>ĐĂNG NHẬP TÀI KHOẢN</h1>

          <!-- Hiển thị thông báo (Thành công từ Đăng ký hoặc Báo lỗi khi sai pass) -->
          {% if messages %}
            {% for message in messages %}
              {% if message.tags == 'error' %}
                <p style="padding: 10px; border-radius: 4px; font-weight: bold; text-align: center; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;">
                  {{ message }}
                </p>
              {% else %}
                <p style="padding: 10px; border-radius: 4px; font-weight: bold; text-align: center; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;">
                  {{ message }}
                </p>
              {% endif %}
            {% endfor %}
          {% endif %}

          <form action="{% url 'login' %}" method="POST" class="box">
            {% csrf_token %}

            <div class="form-input">
              <label for="username">Username:</label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                required
                placeholder="Nhập tên đăng nhập"
              />
            </div>

            <div class="form-input">
              <label for="password">Password:</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
                placeholder="Nhập mật khẩu"
              />
            </div>

            <input type="submit" value="ĐĂNG NHẬP" />
            <br /><br />
            <span>Chưa có tài khoản? <a href="{% url 'register' %}">Đăng Ký</a></span>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
